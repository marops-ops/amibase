name: Oppdater bedriftsdata

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  hent-enheter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests supabase

      - name: Hent og segmenter bedrifter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_enheter.py

  hent-regnskap:
    runs-on: ubuntu-latest
    needs: hent-enheter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests supabase

      - name: Hent manglende regnskapstall
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_regnskap.py
