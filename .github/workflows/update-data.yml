name: Oppdater bedriftsdata

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  hent-enheter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests

      - name: Hent og segmenter bedrifter
        run: python scripts/fetch_enheter.py

      - name: Commit og push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: oppdater bedriftsdata $(date +'%Y-%m-%d')"
          git push

  hent-regnskap:
    runs-on: ubuntu-latest
    needs: hent-enheter
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests

      - name: Hent regnskapstall
        run: python scripts/fetch_regnskap.py

      - name: Commit og push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main
          git add data/
          git diff --staged --quiet || git commit -m "auto: oppdater regnskapstall $(date +'%Y-%m-%d')"
          git push
